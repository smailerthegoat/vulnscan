# vulnscan curated taint rules: PHP (plain PHP, Laravel, Symfony, WordPress).
# Registry packs (p/php, p/phpcs-security-audit) cover API misuse; these rules follow request data
# (superglobals and framework request objects) into dangerous sinks. Tested by tests/rules/php.php.
# Anchors are expanded on purpose: `semgrep --validate` does not resolve YAML aliases.
rules:
- id: vulnscan.php.sql-injection
  mode: taint
  languages:
  - php
  severity: ERROR
  message: Request data is concatenated into SQL. Use prepared statements with bound parameters ($pdo->prepare('... WHERE id = ?')->execute([$id])).
  metadata:
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  pattern-sources:
  - pattern: $_GET
  - pattern: $_POST
  - pattern: $_REQUEST
  - pattern: $_COOKIE
  - pattern: $_FILES
  - patterns:
    - pattern: $_SERVER[$KEY]
    - metavariable-regex:
        metavariable: $KEY
        regex: (HTTP_|REQUEST_URI|QUERY_STRING|PHP_SELF|PATH_INFO|ORIG_PATH_INFO)
  - pattern: file_get_contents('php://input')
  - pattern: getallheaders()
  - pattern: request(...)
  - pattern: Input::get(...)
  - pattern: Request::input(...)
  - pattern: Request::get(...)
  - patterns:
    - pattern-either:
      - pattern: $REQ->input(...)
      - pattern: $REQ->get(...)
      - pattern: $REQ->query(...)
      - pattern: $REQ->post(...)
      - pattern: $REQ->all()
      - pattern: $REQ->only(...)
      - pattern: $REQ->except(...)
      - pattern: $REQ->cookie(...)
      - pattern: $REQ->header(...)
      - pattern: $REQ->route(...)
      - pattern: $REQ->file(...)
      - pattern: $REQ->json(...)
      - pattern: $REQ->getContent()
      - pattern: $REQ->query->get(...)
      - pattern: $REQ->query->all()
      - pattern: $REQ->request->get(...)
      - pattern: $REQ->request->all()
      - pattern: $REQ->headers->get(...)
      - pattern: $REQ->cookies->get(...)
    - metavariable-regex:
        metavariable: $REQ
        regex: ^\$?(request|req)$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: mysqli_query($C, $Q, ...)
      - pattern: mysqli_multi_query($C, $Q)
      - pattern: mysqli_real_query($C, $Q)
      - pattern: mysql_query($Q, ...)
      - pattern: pg_query($C, $Q)
      - pattern: pg_query($Q)
      - pattern: $DB->query($Q, ...)
      - pattern: $DB->exec($Q)
      - pattern: $DB->prepare($Q, ...)
      - pattern: $DB->multi_query($Q)
      - pattern: $DB->real_query($Q)
      - pattern: $DB->executeQuery($Q, ...)
      - pattern: $DB->executeStatement($Q, ...)
      - pattern: $DB->createQuery($Q)
      - pattern: $DB->get_results($Q, ...)
      - pattern: $DB->get_row($Q, ...)
      - pattern: $DB->get_var($Q, ...)
      - pattern: $DB->get_col($Q, ...)
      - pattern: DB::$M($Q, ...)
      - pattern: $QB->whereRaw($Q, ...)
      - pattern: $QB->orWhereRaw($Q, ...)
      - pattern: $QB->havingRaw($Q, ...)
      - pattern: $QB->orderByRaw($Q, ...)
      - pattern: $QB->selectRaw($Q, ...)
      - pattern: $QB->groupByRaw($Q, ...)
      - pattern: $M::whereRaw($Q, ...)
    - focus-metavariable: $Q
  pattern-sanitizers:
  - pattern: intval(...)
  - pattern: floatval(...)
  - pattern: (int)$X
  - pattern: (float)$X
  - pattern: mysqli_real_escape_string(...)
  - pattern: $DB->real_escape_string(...)
  - pattern: $DB->quote(...)
  - pattern: $DB->prepare(...)
  - pattern: esc_sql(...)
  - pattern: pg_escape_string(...)
