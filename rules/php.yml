    - metavariable-regex:
        metavariable: $FN
        regex: ^(file_get_contents|file_put_contents|fopen|readfile|file|unlink|copy|rename|opendir|scandir|rmdir|mkdir|is_file|filesize|parse_ini_file|highlight_file|show_source)$
