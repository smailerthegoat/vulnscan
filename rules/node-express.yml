    category: security
    confidence: MEDIUM
    vulnscan-class: web
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.cookies
      - pattern: $REQ.signedCookies
      - pattern: $REQ.headers
      - pattern: $REQ.files
      - pattern: $REQ.file
      - pattern: $REQ.url
      - pattern: $REQ.originalUrl
      - pattern: $REQ.path
      - pattern: $REQ.get(...)
      - pattern: $REQ.header(...)
      - pattern: $REQ.param(...)
      - pattern: $REQ.json()
      - pattern: $REQ.formData()
      - pattern: $REQ.text()
      - pattern: $REQ.nextUrl.searchParams
    - metavariable-regex:
        metavariable: $REQ
        regex: ^(req|request)$
  - patterns:
    - pattern-either:
      - pattern: $CTX.query
      - pattern: $CTX.params
      - pattern: $CTX.request.body
      - pattern: $CTX.request.query
      - pattern: $CTX.headers
      - pattern: $CTX.cookies.get(...)
    - metavariable-regex:
        metavariable: $CTX
        regex: ^ctx$
  - patterns:
    - pattern-either:
      - pattern-inside: '$M(..., @$DECO(...) $P, ...) { ... }

          '
      - pattern-inside: '$M(..., @$DECO(...) $P: $T, ...) { ... }

          '
    - metavariable-regex:
        metavariable: $DECO
        regex: ^(Query|Param|Body|Headers|Req|Request|UploadedFile|Cookies)$
    - pattern: $P
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: '"$PFX" + $X'
      - pattern: '`$PFX${$X}...`'
    - metavariable-regex:
        metavariable: $PFX
        regex: ^https?://[^/$]+/
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: fetch($U, ...)
      - pattern: axios($U, ...)
      - pattern: axios.$M($U, ...)
      - pattern: http.get($U, ...)
