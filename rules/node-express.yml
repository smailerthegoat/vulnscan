- id: vulnscan.js.path-traversal
  mode: taint
  languages:
  - js
  - ts
  severity: WARNING
  message: Request data is used as a file path. Keep only path.basename() or resolve and check the prefix against the base directory.
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: web
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.cookies
      - pattern: $REQ.signedCookies
      - pattern: $REQ.headers
      - pattern: $REQ.files
      - pattern: $REQ.file
      - pattern: $REQ.url
      - pattern: $REQ.originalUrl
      - pattern: $REQ.path
      - pattern: $REQ.get(...)
      - pattern: $REQ.header(...)
      - pattern: $REQ.param(...)
      - pattern: $REQ.json()
      - pattern: $REQ.formData()
      - pattern: $REQ.text()
      - pattern: $REQ.nextUrl.searchParams
    - metavariable-regex:
        metavariable: $REQ
        regex: ^(req|request)$
  - patterns:
    - pattern-either:
      - pattern: $CTX.query
      - pattern: $CTX.params
      - pattern: $CTX.request.body
      - pattern: $CTX.request.query
      - pattern: $CTX.headers
      - pattern: $CTX.cookies.get(...)
    - metavariable-regex:
        metavariable: $CTX
        regex: ^ctx$
  - patterns:
    - pattern-either:
      - pattern-inside: '$M(..., @$DECO(...) $P, ...) { ... }

          '
      - pattern-inside: '$M(..., @$DECO(...) $P: $T, ...) { ... }

          '
    - metavariable-regex:
        metavariable: $DECO
        regex: ^(Query|Param|Body|Headers|Req|Request|UploadedFile|Cookies)$
    - pattern: $P
  pattern-sanitizers:
  - pattern: path.basename(...)
  - pattern: parseInt(...)
  - pattern: Number(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: fs.$F($P, ...)
      - pattern: fs.promises.$F($P, ...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(readFile|readFileSync|createReadStream|createWriteStream|writeFile|writeFileSync|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|readdir|readdirSync|open|openSync|copyFile|copyFileSync|rename|renameSync)$
    - focus-metavariable: $P
  - patterns:
    - pattern-either:
      - pattern: $RES.sendFile($P, ...)
      - pattern: $RES.download($P, ...)
    - pattern-not: '$RES.sendFile($P, {..., root: $ROOT, ...}, ...)'
    - focus-metavariable: $P
