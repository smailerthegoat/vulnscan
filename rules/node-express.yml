      - pattern: $CTX.request.query
      - pattern: $CTX.headers
      - pattern: $CTX.cookies.get(...)
    - metavariable-regex:
        metavariable: $CTX
        regex: ^ctx$
  - patterns:
    - pattern-either:
      - pattern-inside: '$M(..., @$DECO(...) $P, ...) { ... }

          '
      - pattern-inside: '$M(..., @$DECO(...) $P: $T, ...) { ... }

          '
    - metavariable-regex:
        metavariable: $DECO
        regex: ^(Query|Param|Body|Headers|Req|Request|UploadedFile|Cookies)$
    - pattern: $P
  pattern-sanitizers:
  - pattern: parseInt(...)
  - pattern: parseFloat(...)
  - pattern: Number(...)
  - pattern: Number.parseInt(...)
  - pattern: Boolean(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: eval($X, ...)
      - pattern: new Function(..., $X)
      - pattern: Function(..., $X)
      - pattern: setTimeout($X, ...)
      - pattern: setInterval($X, ...)
      - pattern: vm.runInNewContext($X, ...)
      - pattern: vm.runInThisContext($X, ...)
      - pattern: vm.runInContext($X, ...)
      - pattern: vm.compileFunction($X, ...)
      - pattern: new vm.Script($X, ...)
    - focus-metavariable: $X
