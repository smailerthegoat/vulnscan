# vulnscan curated taint rules: Node.js / TypeScript servers (Express, Fastify, Koa, NestJS,
# Next.js API routes) plus browser DOM XSS. Registry packs (p/javascript, p/typescript, p/nodejsscan,
# p/expressjs) cover API misuse; these rules follow request data into dangerous sinks.
# Tested by tests/rules/node-express.js and tests/rules/node-express.ts (`semgrep --test`).
# Anchors are expanded on purpose: `semgrep --validate` does not resolve YAML aliases.
rules:
- id: vulnscan.js.sql-injection
  mode: taint
  languages:
  - js
  - ts
  severity: ERROR
  message: Request data is built into a SQL string. Use placeholders (db.query('... WHERE id = ?', [id])) or the ORM's bound parameters.
  metadata:
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.cookies
      - pattern: $REQ.signedCookies
      - pattern: $REQ.headers
      - pattern: $REQ.files
      - pattern: $REQ.file
      - pattern: $REQ.url
      - pattern: $REQ.originalUrl
      - pattern: $REQ.path
      - pattern: $REQ.get(...)
      - pattern: $REQ.header(...)
      - pattern: $REQ.param(...)
      - pattern: $REQ.json()
      - pattern: $REQ.formData()
      - pattern: $REQ.text()
      - pattern: $REQ.nextUrl.searchParams
    - metavariable-regex:
        metavariable: $REQ
        regex: ^(req|request)$
  - patterns:
    - pattern-either:
      - pattern: $CTX.query
      - pattern: $CTX.params
      - pattern: $CTX.request.body
      - pattern: $CTX.request.query
      - pattern: $CTX.headers
      - pattern: $CTX.cookies.get(...)
    - metavariable-regex:
        metavariable: $CTX
        regex: ^ctx$
  - patterns:
    - pattern-either:
      - pattern-inside: '$M(..., @$DECO(...) $P, ...) { ... }

          '
      - pattern-inside: '$M(..., @$DECO(...) $P: $T, ...) { ... }

          '
    - metavariable-regex:
        metavariable: $DECO
        regex: ^(Query|Param|Body|Headers|Req|Request|UploadedFile|Cookies)$
    - pattern: $P
  pattern-sanitizers:
  - pattern: parseInt(...)
  - pattern: parseFloat(...)
  - pattern: Number(...)
  - pattern: Number.parseInt(...)
  - pattern: Boolean(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $DB.query($Q, ...)
      - pattern: $DB.execute($Q, ...)
      - pattern: $DB.raw($Q, ...)
      - pattern: $DB.$queryRawUnsafe($Q, ...)
      - pattern: $DB.$executeRawUnsafe($Q, ...)
      - pattern: $DB.whereRaw($Q, ...)
      - pattern: $DB.orderByRaw($Q, ...)
      - pattern: $DB.havingRaw($Q, ...)
      - pattern: $DB.joinRaw($Q, ...)
      - pattern: $SEQ.literal($Q)
    - focus-metavariable: $Q
  - patterns:
    - pattern-either:
      - pattern: $DB.all($Q, ...)
      - pattern: $DB.get($Q, ...)
      - pattern: $DB.run($Q, ...)
      - pattern: $DB.each($Q, ...)
      - pattern: $DB.exec($Q, ...)
      - pattern: $DB.prepare($Q, ...)
      - pattern: $QB.where($Q, ...)
      - pattern: $QB.andWhere($Q, ...)
      - pattern: $QB.orWhere($Q, ...)
    - metavariable-pattern:
        metavariable: $Q
        pattern-regex: (?i)\b(select|insert|update|delete|replace|where|order by|like)\b
    - focus-metavariable: $Q
- id: vulnscan.js.nosql-injection
  mode: taint
  languages:
  - js
  - ts
  severity: WARNING
  message: 'Request data is used as a MongoDB query object; a JSON body can inject operators such as {"$ne": null}. Cast values with String() or validate the schema.'
  metadata:
    cwe:
    - 'CWE-943: Improper Neutralization of Special Elements in Data Query Logic'
    category: security
    confidence: LOW
    vulnscan-class: injection
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.cookies
      - pattern: $REQ.signedCookies
      - pattern: $REQ.headers
      - pattern: $REQ.files
      - pattern: $REQ.file
      - pattern: $REQ.url
      - pattern: $REQ.originalUrl
      - pattern: $REQ.path
      - pattern: $REQ.get(...)
      - pattern: $REQ.header(...)
      - pattern: $REQ.param(...)
      - pattern: $REQ.json()
      - pattern: $REQ.formData()
      - pattern: $REQ.text()
      - pattern: $REQ.nextUrl.searchParams
    - metavariable-regex:
        metavariable: $REQ
        regex: ^(req|request)$
  - patterns:
    - pattern-either:
      - pattern: $CTX.query
      - pattern: $CTX.params
      - pattern: $CTX.request.body
      - pattern: $CTX.request.query
      - pattern: $CTX.headers
      - pattern: $CTX.cookies.get(...)
    - metavariable-regex:
        metavariable: $CTX
        regex: ^ctx$
  - patterns:
    - pattern-either:
      - pattern-inside: '$M(..., @$DECO(...) $P, ...) { ... }

          '
      - pattern-inside: '$M(..., @$DECO(...) $P: $T, ...) { ... }

          '
    - metavariable-regex:
        metavariable: $DECO
        regex: ^(Query|Param|Body|Headers|Req|Request|UploadedFile|Cookies)$
    - pattern: $P
  pattern-sanitizers:
  - pattern: String(...)
  - pattern: $X.toString()
  - pattern: parseInt(...)
  - pattern: Number(...)
  - pattern: mongoSanitize.sanitize(...)
  - pattern: sanitize(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $M.find($Q, ...)
      - pattern: $M.findOne($Q, ...)
      - pattern: $M.findOneAndUpdate($Q, ...)
      - pattern: $M.findOneAndDelete($Q, ...)
      - pattern: $M.updateOne($Q, ...)
      - pattern: $M.updateMany($Q, ...)
      - pattern: $M.deleteOne($Q, ...)
      - pattern: $M.deleteMany($Q, ...)
      - pattern: $M.countDocuments($Q, ...)
      - pattern: '$M.find({..., $where: $Q, ...})'
    - pattern-not: $M.find(($X) => $BODY, ...)
    - pattern-not: $M.find(function (...) { ... }, ...)
    - pattern-not: $M.findOne(($X) => $BODY, ...)
    - focus-metavariable: $Q
- id: vulnscan.js.command-injection
  mode: taint
  languages:
  - js
  - ts
  severity: ERROR
  message: Request data reaches a shell command or chooses the program. Use execFile/spawn with a fixed program and an argument array.
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.cookies
      - pattern: $REQ.signedCookies
      - pattern: $REQ.headers
      - pattern: $REQ.files
      - pattern: $REQ.file
      - pattern: $REQ.url
      - pattern: $REQ.originalUrl
      - pattern: $REQ.path
      - pattern: $REQ.get(...)
      - pattern: $REQ.header(...)
      - pattern: $REQ.param(...)
      - pattern: $REQ.json()
      - pattern: $REQ.formData()
      - pattern: $REQ.text()
      - pattern: $REQ.nextUrl.searchParams
    - metavariable-regex:
        metavariable: $REQ
        regex: ^(req|request)$
  - patterns:
    - pattern-either:
      - pattern: $CTX.query
      - pattern: $CTX.params
      - pattern: $CTX.request.body
      - pattern: $CTX.request.query
      - pattern: $CTX.headers
      - pattern: $CTX.cookies.get(...)
    - metavariable-regex:
        metavariable: $CTX
        regex: ^ctx$
  - patterns:
    - pattern-either:
      - pattern-inside: '$M(..., @$DECO(...) $P, ...) { ... }

          '
      - pattern-inside: '$M(..., @$DECO(...) $P: $T, ...) { ... }

          '
    - metavariable-regex:
        metavariable: $DECO
        regex: ^(Query|Param|Body|Headers|Req|Request|UploadedFile|Cookies)$
    - pattern: $P
  pattern-sanitizers:
  - pattern: parseInt(...)
  - pattern: parseFloat(...)
  - pattern: Number(...)
  - pattern: Number.parseInt(...)
  - pattern: Boolean(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: child_process.exec($CMD, ...)
      - pattern: child_process.execSync($CMD, ...)
      - pattern: child_process.execFile($CMD, ...)
      - pattern: child_process.execFileSync($CMD, ...)
      - pattern: child_process.spawn($CMD, ...)
      - pattern: child_process.spawnSync($CMD, ...)
      - pattern: require('child_process').$F($CMD, ...)
      - pattern: shell.exec($CMD, ...)
    - focus-metavariable: $CMD
  - patterns:
    - pattern-either:
      - pattern: child_process.spawn("$SH", ["$FLAG", $ARG, ...], ...)
      - pattern: child_process.execFile("$SH", ["$FLAG", $ARG, ...], ...)
    - metavariable-regex:
        metavariable: $SH
        regex: ^(/usr)?(/bin/)?(sh|bash|zsh|cmd|cmd\.exe|powershell|pwsh)$
    - metavariable-regex:
        metavariable: $FLAG
        regex: ^(-c|/c|/C|-Command)$
    - focus-metavariable: $ARG
  - patterns:
    - pattern-either:
      - pattern: 'child_process.spawn($CMD, $ARGS, {..., shell: true, ...})'
      - pattern: 'child_process.spawnSync($CMD, $ARGS, {..., shell: true, ...})'
    - focus-metavariable: $ARGS
  - patterns:
    - pattern-either:
      - pattern-inside: '$EXEC = require(''child_process'').$FN;

          ...

          '
      - pattern-inside: '$EXEC = require(''child_process'').$FN

          ...

          '
    - metavariable-regex:
        metavariable: $FN
        regex: ^(exec|execSync)$
    - pattern: $EXEC($CMD, ...)
    - focus-metavariable: $CMD
