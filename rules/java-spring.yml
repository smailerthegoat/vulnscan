# vulnscan curated taint rules: Java / Kotlin-free Spring MVC and Servlet code.
# Sources are the parameters of @*Mapping handler methods (Spring binds them from the request) and
# HttpServletRequest accessors. Registry packs (p/java, p/findsecbugs) cover API misuse such as XXE
# and weak crypto. Tested by tests/rules/java-spring.java (`semgrep --test`).
# Anchors are expanded on purpose: `semgrep --validate` does not resolve YAML aliases.
rules:
- id: vulnscan.java.sql-injection
  mode: taint
  languages:
  - java
  severity: ERROR
  message: Request data is concatenated into SQL/JPQL. Use bind parameters (PreparedStatement ?, :name, Criteria API).
  metadata:
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  options:
    taint_assume_safe_numbers: true
    taint_assume_safe_booleans: true
  pattern-sources:
  - patterns:
    - pattern-inside: '@$MAPPING(...)

        $RET $METHOD(..., $TYPE $PARAM, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $MAPPING
        regex: ^(Get|Post|Put|Delete|Patch|Request)Mapping$
    - metavariable-regex:
        metavariable: $TYPE
        regex: ^(?!(Principal|Authentication|Model|ModelMap|ModelAndView|HttpServletResponse|BindingResult|Errors|Locale|HttpSession|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort)$)
    - pattern: $PARAM
  - pattern: (HttpServletRequest $REQ).getParameter(...)
  - pattern: (HttpServletRequest $REQ).getParameterValues(...)
  - pattern: (HttpServletRequest $REQ).getParameterMap()
  - pattern: (HttpServletRequest $REQ).getHeader(...)
  - pattern: (HttpServletRequest $REQ).getQueryString()
  - pattern: (HttpServletRequest $REQ).getPathInfo()
  - pattern: (HttpServletRequest $REQ).getRequestURI()
  - pattern: (HttpServletRequest $REQ).getCookies()
  - pattern: (HttpServletRequest $REQ).getInputStream()
  - pattern: (HttpServletRequest $REQ).getReader()
  - pattern: (HttpServletRequest $REQ).getPart(...)
  pattern-sanitizers:
  - pattern: Integer.parseInt(...)
  - pattern: Integer.valueOf(...)
  - pattern: Long.parseLong(...)
  - pattern: Long.valueOf(...)
  - pattern: UUID.fromString(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $S.executeQuery($Q)
      - pattern: $S.executeUpdate($Q, ...)
      - pattern: $S.executeLargeUpdate($Q, ...)
      - pattern: $S.addBatch($Q)
      - pattern: (Statement $S).execute($Q, ...)
      - pattern: $C.prepareStatement($Q, ...)
      - pattern: $C.prepareCall($Q, ...)
      - pattern: $EM.createQuery($Q, ...)
      - pattern: $EM.createNativeQuery($Q, ...)
      - pattern: $EM.createSQLQuery($Q)
      - pattern: $J.queryForObject($Q, ...)
      - pattern: $J.queryForList($Q, ...)
      - pattern: $J.queryForMap($Q, ...)
      - pattern: $J.queryForRowSet($Q, ...)
      - pattern: $J.batchUpdate($Q, ...)
      - pattern: (JdbcTemplate $J).query($Q, ...)
      - pattern: (JdbcTemplate $J).update($Q, ...)
      - pattern: (JdbcTemplate $J).execute($Q, ...)
      - pattern: (NamedParameterJdbcTemplate $J).query($Q, ...)
      - pattern: (NamedParameterJdbcTemplate $J).update($Q, ...)
    - focus-metavariable: $Q
- id: vulnscan.java.command-injection
  mode: taint
  languages:
  - java
  severity: ERROR
  message: Request data reaches a process command line. Use a fixed program with separate, validated arguments.
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  options:
    taint_assume_safe_numbers: true
    taint_assume_safe_booleans: true
  pattern-sources:
  - patterns:
    - pattern-inside: '@$MAPPING(...)

        $RET $METHOD(..., $TYPE $PARAM, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $MAPPING
        regex: ^(Get|Post|Put|Delete|Patch|Request)Mapping$
    - metavariable-regex:
        metavariable: $TYPE
        regex: ^(?!(Principal|Authentication|Model|ModelMap|ModelAndView|HttpServletResponse|BindingResult|Errors|Locale|HttpSession|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort)$)
    - pattern: $PARAM
  - pattern: (HttpServletRequest $REQ).getParameter(...)
  - pattern: (HttpServletRequest $REQ).getParameterValues(...)
  - pattern: (HttpServletRequest $REQ).getParameterMap()
  - pattern: (HttpServletRequest $REQ).getHeader(...)
  - pattern: (HttpServletRequest $REQ).getQueryString()
  - pattern: (HttpServletRequest $REQ).getPathInfo()
  - pattern: (HttpServletRequest $REQ).getRequestURI()
  - pattern: (HttpServletRequest $REQ).getCookies()
  - pattern: (HttpServletRequest $REQ).getInputStream()
  - pattern: (HttpServletRequest $REQ).getReader()
  - pattern: (HttpServletRequest $REQ).getPart(...)
  pattern-sanitizers:
  - pattern: Integer.parseInt(...)
  - pattern: Integer.valueOf(...)
  - pattern: Long.parseLong(...)
  - pattern: Long.valueOf(...)
  - pattern: UUID.fromString(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Runtime.getRuntime().exec($C, ...)
      - pattern: (Runtime $R).exec($C, ...)
      - pattern: new ProcessBuilder($C, ...)
      - pattern: (ProcessBuilder $PB).command($C, ...)
    - focus-metavariable: $C
  - patterns:
    - pattern: new ProcessBuilder("$SH", "$FLAG", $ARG, ...)
    - metavariable-regex:
        metavariable: $SH
        regex: ^(/usr)?(/bin/)?(sh|bash|zsh|cmd|cmd\.exe|powershell|pwsh)$
    - metavariable-regex:
        metavariable: $FLAG
        regex: ^(-c|/c|/C|-Command)$
    - focus-metavariable: $ARG
- id: vulnscan.java.path-traversal
  mode: taint
  languages:
  - java
  severity: WARNING
  message: Request data is used as a file path. Keep only the file name (FilenameUtils.getName) or check the normalized path stays under the base directory.
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: web
  options:
    taint_assume_safe_numbers: true
    taint_assume_safe_booleans: true
  pattern-sources:
  - patterns:
    - pattern-inside: '@$MAPPING(...)

        $RET $METHOD(..., $TYPE $PARAM, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $MAPPING
        regex: ^(Get|Post|Put|Delete|Patch|Request)Mapping$
    - metavariable-regex:
        metavariable: $TYPE
        regex: ^(?!(Principal|Authentication|Model|ModelMap|ModelAndView|HttpServletResponse|BindingResult|Errors|Locale|HttpSession|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort)$)
    - pattern: $PARAM
  - pattern: (HttpServletRequest $REQ).getParameter(...)
  - pattern: (HttpServletRequest $REQ).getParameterValues(...)
  - pattern: (HttpServletRequest $REQ).getParameterMap()
  - pattern: (HttpServletRequest $REQ).getHeader(...)
  - pattern: (HttpServletRequest $REQ).getQueryString()
  - pattern: (HttpServletRequest $REQ).getPathInfo()
  - pattern: (HttpServletRequest $REQ).getRequestURI()
  - pattern: (HttpServletRequest $REQ).getCookies()
  - pattern: (HttpServletRequest $REQ).getInputStream()
  - pattern: (HttpServletRequest $REQ).getReader()
  - pattern: (HttpServletRequest $REQ).getPart(...)
  pattern-sanitizers:
  - pattern: FilenameUtils.getName(...)
  - pattern: $P.getFileName()
  - pattern: Integer.parseInt(...)
  - pattern: Long.parseLong(...)
  - pattern: UUID.fromString(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: new File($P)
      - pattern: new File($D, $P)
      - pattern: new FileInputStream($P)
      - pattern: new FileOutputStream($P, ...)
      - pattern: new FileReader($P, ...)
      - pattern: new FileWriter($P, ...)
      - pattern: new RandomAccessFile($P, ...)
      - pattern: Paths.get($P, ...)
      - pattern: Paths.get($D, $P, ...)
      - pattern: Path.of($P, ...)
      - pattern: Path.of($D, $P, ...)
      - pattern: (Path $BASE).resolve($P)
      - pattern: new FileSystemResource($P)
      - pattern: new ClassPathResource($P)
    - focus-metavariable: $P
- id: vulnscan.java.ssrf
  mode: taint
  languages:
  - java
  severity: WARNING
  message: Request data controls the destination of a server-side request. Allowlist hosts and block internal addresses after DNS resolution.
  metadata:
    cwe:
    - 'CWE-918: Server-Side Request Forgery (SSRF)'
    category: security
    confidence: MEDIUM
    vulnscan-class: web
  options:
    taint_assume_safe_numbers: true
    taint_assume_safe_booleans: true
  pattern-sources:
  - patterns:
    - pattern-inside: '@$MAPPING(...)

        $RET $METHOD(..., $TYPE $PARAM, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $MAPPING
        regex: ^(Get|Post|Put|Delete|Patch|Request)Mapping$
    - metavariable-regex:
        metavariable: $TYPE
        regex: ^(?!(Principal|Authentication|Model|ModelMap|ModelAndView|HttpServletResponse|BindingResult|Errors|Locale|HttpSession|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort)$)
    - pattern: $PARAM
  - pattern: (HttpServletRequest $REQ).getParameter(...)
  - pattern: (HttpServletRequest $REQ).getParameterValues(...)
  - pattern: (HttpServletRequest $REQ).getParameterMap()
  - pattern: (HttpServletRequest $REQ).getHeader(...)
  - pattern: (HttpServletRequest $REQ).getQueryString()
  - pattern: (HttpServletRequest $REQ).getPathInfo()
  - pattern: (HttpServletRequest $REQ).getRequestURI()
  - pattern: (HttpServletRequest $REQ).getCookies()
  - pattern: (HttpServletRequest $REQ).getInputStream()
  - pattern: (HttpServletRequest $REQ).getReader()
  - pattern: (HttpServletRequest $REQ).getPart(...)
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: '"$PFX" + $X'
      - pattern: String.format("$PFX", ...)
    - metavariable-regex:
        metavariable: $PFX
        regex: ^https?://[^/%]+/
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $U.openConnection(...)
      - pattern: $U.openStream()
      - pattern: (RestTemplate $RT).getForObject($U, ...)
      - pattern: (RestTemplate $RT).getForEntity($U, ...)
      - pattern: (RestTemplate $RT).postForObject($U, ...)
      - pattern: (RestTemplate $RT).postForEntity($U, ...)
      - pattern: (RestTemplate $RT).exchange($U, ...)
      - pattern: (RestTemplate $RT).put($U, ...)
      - pattern: (RestTemplate $RT).delete($U, ...)
      - pattern: $WC.get().uri($U, ...)
      - pattern: $WC.post().uri($U, ...)
      - pattern: HttpRequest.newBuilder($U)
      - pattern: HttpRequest.newBuilder().uri($U)
      - pattern: Jsoup.connect($U)
      - pattern: new HttpGet($U)
      - pattern: new HttpPost($U)
    - focus-metavariable: $U
