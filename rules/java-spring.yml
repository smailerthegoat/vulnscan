    - pattern-inside: '@$MAPPING(...)

        String $METHOD(...) { ... }

        '
    - pattern: return $VIEW;
    - pattern-not: return "redirect:" + $X;
    - pattern-not: return "forward:" + $X;
    - focus-metavariable: $VIEW
