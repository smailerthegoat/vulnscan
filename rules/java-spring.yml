- id: vulnscan.java.xss
  mode: taint
  languages:
  - java
  severity: WARNING
  message: Request data is written into the HTTP response without HTML encoding.
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site Scripting'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: web
  options:
    taint_assume_safe_numbers: true
    taint_assume_safe_booleans: true
  pattern-sources:
  - patterns:
    - pattern-inside: '@$MAPPING(...)

        $RET $METHOD(..., $TYPE $PARAM, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $MAPPING
        regex: ^(Get|Post|Put|Delete|Patch|Request)Mapping$
    - metavariable-regex:
        metavariable: $TYPE
        regex: ^(?!(Principal|Authentication|Model|ModelMap|ModelAndView|HttpServletResponse|BindingResult|Errors|Locale|HttpSession|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort)$)
    - pattern: $PARAM
  - pattern: (HttpServletRequest $REQ).getParameter(...)
  - pattern: (HttpServletRequest $REQ).getParameterValues(...)
  - pattern: (HttpServletRequest $REQ).getParameterMap()
  - pattern: (HttpServletRequest $REQ).getHeader(...)
  - pattern: (HttpServletRequest $REQ).getQueryString()
  - pattern: (HttpServletRequest $REQ).getPathInfo()
  - pattern: (HttpServletRequest $REQ).getRequestURI()
  - pattern: (HttpServletRequest $REQ).getCookies()
  - pattern: (HttpServletRequest $REQ).getInputStream()
  - pattern: (HttpServletRequest $REQ).getReader()
  - pattern: (HttpServletRequest $REQ).getPart(...)
  pattern-sanitizers:
  - pattern: HtmlUtils.htmlEscape(...)
  - pattern: StringEscapeUtils.escapeHtml4(...)
  - pattern: Encode.forHtml(...)
  - pattern: Encode.forHtmlContent(...)
  - pattern: ESAPI.encoder().encodeForHTML(...)
  - pattern: Integer.parseInt(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: (HttpServletResponse $RESP).getWriter().$W($X, ...)
      - pattern: (PrintWriter $PW).$W($X, ...)
    - metavariable-regex:
        metavariable: $W
        regex: ^(write|print|println|printf|format|append)$
    - focus-metavariable: $X
