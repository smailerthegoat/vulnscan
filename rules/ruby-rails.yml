# vulnscan curated taint rules: Ruby on Rails and Sinatra.
# Registry packs (p/ruby, p/brakeman) cover configuration and API misuse; these rules follow request
# data (params, cookies, headers) into dangerous sinks. Tested by tests/rules/ruby-rails.rb.
# Anchors are expanded on purpose: `semgrep --validate` does not resolve YAML aliases.
rules:
- id: vulnscan.ruby.sql-injection
  mode: taint
  languages:
  - ruby
  severity: ERROR
  message: Request data is interpolated into SQL passed to ActiveRecord. Use hash conditions or placeholders (where("name = ?", name)).
  metadata:
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sanitizers:
  - pattern: $X.to_i
  - pattern: $X.to_f
  - pattern: Integer(...)
  - pattern: Float(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $M.where($Q, ...)
      - pattern: $M.not($Q, ...)
      - pattern: $M.rewhere($Q, ...)
      - pattern: $M.find_by($Q, ...)
      - pattern: $M.find_by_sql($Q, ...)
      - pattern: $M.count_by_sql($Q, ...)
      - pattern: $M.order($Q, ...)
      - pattern: $M.reorder($Q, ...)
      - pattern: $M.group($Q, ...)
      - pattern: $M.having($Q, ...)
      - pattern: $M.joins($Q, ...)
      - pattern: $M.select($Q, ...)
      - pattern: $M.pluck($Q, ...)
      - pattern: $M.from($Q, ...)
      - pattern: $M.lock($Q)
      - pattern: $M.exists?($Q)
      - pattern: $M.calculate($OP, $Q)
      - pattern: $M.update_all($Q, ...)
      - pattern: $M.delete_all($Q, ...)
      - pattern: $M.delete_by($Q, ...)
      - pattern: $M.destroy_by($Q, ...)
      - pattern: $CONN.execute($Q, ...)
      - pattern: $CONN.exec_query($Q, ...)
      - pattern: $CONN.select_all($Q, ...)
      - pattern: $CONN.select_one($Q, ...)
      - pattern: $CONN.select_value($Q, ...)
      - pattern: $CONN.select_values($Q, ...)
      - pattern: $CONN.select_rows($Q, ...)
      - pattern: Arel.sql($Q)
    - pattern-not: '$M.$F($K: $V, ...)'
    - pattern-not: $M.$F($K => $V, ...)
    - focus-metavariable: $Q
- id: vulnscan.ruby.command-injection
  mode: taint
  languages:
  - ruby
  severity: ERROR
  message: Request data reaches a shell command line (or chooses the program). Pass a fixed program and separate arguments, e.g. system("ping", "-c", "1", host).
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sanitizers:
  - pattern: Shellwords.escape(...)
  - pattern: $X.shellescape
  - pattern: $X.to_i
  - pattern: Integer(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: system($C)
      - pattern: exec($C)
      - pattern: spawn($C)
      - pattern: Kernel.system($C)
      - pattern: Kernel.exec($C)
      - pattern: Kernel.spawn($C)
      - pattern: system($C, $ARG, ...)
      - pattern: exec($C, $ARG, ...)
      - pattern: spawn($C, $ARG, ...)
      - pattern: IO.popen($C, ...)
      - pattern: Open3.capture2($C, ...)
      - pattern: Open3.capture2e($C, ...)
      - pattern: Open3.capture3($C, ...)
      - pattern: Open3.popen2($C, ...)
      - pattern: Open3.popen2e($C, ...)
      - pattern: Open3.popen3($C, ...)
      - pattern: Open3.pipeline($C, ...)
      - pattern: PTY.spawn($C, ...)
      - pattern: open($C, ...)
      - pattern: Kernel.open($C, ...)
    - focus-metavariable: $C
  - pattern: '`...`'
- id: vulnscan.ruby.code-injection
  mode: taint
  languages:
  - ruby
  severity: ERROR
  message: Request data is evaluated as Ruby code.
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: eval($X, ...)
      - pattern: $O.instance_eval($X, ...)
      - pattern: $O.class_eval($X, ...)
      - pattern: $O.module_eval($X, ...)
      - pattern: $B.eval($X, ...)
    - focus-metavariable: $X
- id: vulnscan.ruby.unsafe-reflection
  mode: taint
  languages:
  - ruby
  severity: WARNING
  message: Request data picks a class or method to call (constantize/send), which can reach dangerous methods.
  metadata:
    cwe:
    - 'CWE-470: Use of Externally-Controlled Input to Select Classes or Code (''Unsafe Reflection'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $X.constantize
      - pattern: $X.safe_constantize
      - pattern: Object.const_get($X, ...)
      - pattern: $O.send($X, ...)
      - pattern: $O.__send__($X, ...)
      - pattern: $O.public_send($X, ...)
      - pattern: $O.method($X)
    - focus-metavariable: $X
- id: vulnscan.ruby.path-traversal
  mode: taint
  languages:
  - ruby
  severity: WARNING
  message: Request data is used as a file path. Keep only File.basename or check the expanded path stays under the base directory.
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: web
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sanitizers:
  - pattern: File.basename(...)
  - pattern: $X.to_i
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: File.$F($P, ...)
      - pattern: IO.$F($P, ...)
      - pattern: FileUtils.$F($P, ...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(read|open|new|readlines|binread|write|binwrite|delete|unlink|foreach|rm|rm_f|rm_rf|cp|mv|copy|move|remove)$
    - focus-metavariable: $P
  - patterns:
    - pattern-either:
      - pattern: Pathname.new($P)
      - pattern: send_file($P, ...)
      - pattern: send_data(File.read($P), ...)
      - pattern: 'render(file: $P, ...)'
    - focus-metavariable: $P
- id: vulnscan.ruby.ssrf
  mode: taint
  languages:
  - ruby
  severity: WARNING
  message: Request data controls the destination of a server-side HTTP request. Allowlist hosts and block internal addresses after DNS resolution.
  metadata:
    cwe:
    - 'CWE-918: Server-Side Request Forgery (SSRF)'
    category: security
    confidence: MEDIUM
    vulnscan-class: web
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Net::HTTP.get($U, ...)
      - pattern: Net::HTTP.get_response($U, ...)
      - pattern: Net::HTTP.start($U, ...)
      - pattern: Net::HTTP.new($U, ...)
      - pattern: URI.open($U, ...)
      - pattern: HTTParty.$M($U, ...)
      - pattern: Faraday.$M($U, ...)
      - pattern: RestClient.$M($U, ...)
      - pattern: Excon.$M($U, ...)
      - pattern: HTTP.$M($U, ...)
      - pattern: 'Faraday.new(url: $U, ...)'
    - focus-metavariable: $U
- id: vulnscan.ruby.open-redirect
  mode: taint
  languages:
  - ruby
  severity: WARNING
  message: Request data is used as a redirect target. Redirect only to relative paths or allowlisted hosts (Rails 7 allow_other_host defaults help).
  metadata:
    cwe:
    - 'CWE-601: URL Redirection to Untrusted Site (''Open Redirect'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: web
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sinks:
  - patterns:
    - pattern: redirect_to($U, ...)
    - pattern-not: 'redirect_to($U, ..., allow_other_host: false, ...)'
    - focus-metavariable: $U
  - patterns:
    - pattern: redirect($U, ...)
    - focus-metavariable: $U
- id: vulnscan.ruby.xss
  mode: taint
  languages:
  - ruby
  severity: WARNING
  message: Request data is marked HTML-safe or rendered raw, bypassing Rails auto-escaping.
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site Scripting'')'
    category: security
    confidence: MEDIUM
    vulnscan-class: web
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sanitizers:
  - pattern: ERB::Util.html_escape(...)
  - pattern: h(...)
  - pattern: sanitize(...)
  - pattern: CGI.escapeHTML(...)
  - pattern: $X.to_i
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $X.html_safe
      - pattern: raw($X)
      - pattern: 'render(html: $X, ...)'
      - pattern: 'render(text: $X, ...)'
      - pattern: 'render(plain: $X, content_type: "text/html", ...)'
      - pattern: link_to($NAME, $X, ...)
    - focus-metavariable: $X
- id: vulnscan.ruby.template-injection
  mode: taint
  languages:
  - ruby
  severity: ERROR
  message: Request data is rendered as an ERB/Haml template (server-side template injection, code execution).
  metadata:
    cwe:
    - 'CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine'
    category: security
    confidence: MEDIUM
    vulnscan-class: injection
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: 'render(inline: $X, ...)'
      - pattern: ERB.new($X, ...)
      - pattern: Haml::Engine.new($X, ...)
      - pattern: Tilt::ERBTemplate.new { $X }
    - focus-metavariable: $X
- id: vulnscan.ruby.unsafe-deserialization
  mode: taint
  languages:
  - ruby
  severity: ERROR
  message: Untrusted data is deserialized with Marshal/YAML/Oj object mode (possible RCE).
  metadata:
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    category: security
    confidence: MEDIUM
    vulnscan-class: deserialization-config
  pattern-sources:
  - pattern: params
  - pattern: cookies
  - pattern: request.params
  - pattern: request.query_parameters
  - pattern: request.request_parameters
  - pattern: request.headers
  - pattern: request.env
  - pattern: request.body
  - pattern: request.raw_post
  - pattern: request.query_string
  - pattern: request.path
  - pattern: request.url
  - pattern: request.referer
  - pattern: request.user_agent
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Marshal.load($X, ...)
      - pattern: Marshal.restore($X, ...)
      - pattern: YAML.load($X, ...)
      - pattern: YAML.unsafe_load($X, ...)
      - pattern: Psych.load($X, ...)
      - pattern: Psych.unsafe_load($X, ...)
      - pattern: Oj.load($X, ...)
      - pattern: Oj.object_load($X, ...)
    - pattern-not: 'Oj.load($X, mode: :strict, ...)'
    - pattern-not: 'Oj.load($X, mode: :compat, ...)'
    - focus-metavariable: $X
- id: vulnscan.ruby.mass-assignment
  languages:
  - ruby
  severity: WARNING
  message: params.permit! allows every attribute (including role/admin/owner fields) to be mass-assigned.
  metadata:
    cwe:
    - 'CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes'
    category: security
    confidence: MEDIUM
    vulnscan-class: access-control
  pattern-either:
  - pattern: params.permit!
  - pattern: params.require(...).permit!
  - pattern: $P.permit!
