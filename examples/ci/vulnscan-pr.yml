# Security review of every pull request by the vulnscan agents: a PR comment with validated findings
# only, SARIF in code scanning, and the full report as an artifact. Non-blocking: the check passes either way.
# Copy to .github/workflows/ in the repository to review and set VULNSCAN_REPO below.
# Secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`; uses a Claude subscription, no API bill).
# Runs on `pull_request`, so pull requests from forks get no secrets; the agents only read the code
# (checked out without credentials, read-only guard hook) and the job token can only comment.
name: vulnscan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write     # the comment
  security-events: write   # SARIF upload

concurrency:
  group: vulnscan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VULNSCAN_REPO: smailerthegoat/vulnscan
  VULNSCAN_REF: main

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out vulnscan
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VULNSCAN_REPO }}
          ref: ${{ env.VULNSCAN_REF }}
          persist-credentials: false

      - name: Check out the pull request into targets/pr
        uses: actions/checkout@v4
        with:
          path: targets/pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners and Claude Code
        run: |
          pip install --quiet semgrep bandit
          npm install --global --silent @anthropic-ai/claude-code

      # Headless Claude Code ignores a workspace's permission rules until the workspace is trusted. Only the
      # vulnscan checkout is trusted: its settings come from VULNSCAN_REPO, never from the pull request.
      - name: Trust the vulnscan workspace
        run: |
          python3 -c "import json, os; p = os.path.expanduser('~/.claude.json'); d = json.load(open(p)) if os.path.exists(p) else {}; d.setdefault('projects', {}).setdefault(os.getcwd(), {})['hasTrustDialogAccepted'] = True; json.dump(d, open(p, 'w'))"

      - name: Review only what this pull request changes
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "/vuln-audit pr --diff origin/${{ github.base_ref }} --quick" --output-format json > run.json || true
          python3 -c "import json; m = json.load(open('run.json')); print('error:', m.get('is_error'), '| turns:', m.get('num_turns')); print(str(m.get('result'))[:3000])"
          if [ -f reports/pr/report.md ]; then cat reports/pr/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Comment validated findings on the pull request
        if: always() && hashFiles('reports/pr/findings.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m vulnscan.prcomment pr --repo "${{ github.repository }}" \
            --sha "${{ github.event.pull_request.head.sha }}" > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md

      - name: Upload findings to code scanning
        if: always() && hashFiles('reports/pr/results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/pr/results.sarif
          checkout_path: targets/pr
          category: vulnscan

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnscan-report
          if-no-files-found: ignore
          path: |
            run.json
            reports/pr/report.md
            reports/pr/findings.json
            reports/pr/results.sarif
            reports/pr/architecture.md
